# Exceções por repo. Só liste o que foge do automático.
#
# Automático:
#   base -> develop (DEFAULT_BASE); se o repo não tem origin/develop, usa a branch padrão do remoto
#   run  -> "<pm> run dev", senão "<pm> run start", senão não sobe; pm vem do lockfile (npm/bun/pnpm/yarn)
#
# Formato:  repo | base | run       ("-" = automático, run "none" = nunca sobe no 'feat up')
