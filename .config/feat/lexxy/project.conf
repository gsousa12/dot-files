# Perfil "lexxy" do feat. Arquivo bash (source): só atribuições.
# Para um projeto/emprego novo: copie esta pasta com outro nome e ajuste.

REPOS_ROOT="$HOME/Development/Lexxy"   # onde ficam os repos principais (varredura recursiva)
SCAN_DEPTH=3                            # profundidade máxima da varredura (Lexxy/Core/repo = 2)
IGNORE_REPOS=()                         # nomes a ignorar, ex.: (lexxy-wiki lexxy-core-bun)

FEATURES_DIR="$HOME/features"           # uma pasta por feature: $FEATURES_DIR/ERP-1036/<repo>
ID_PREFIX="ERP-"                        # 'feat new 1036' -> ERP-1036
FEATURE_PREFIX="feature/"               # branch: feature/ERP-1036
FIX_PREFIX="fix/"                       # com --fix: fix/ERP-1036

DEFAULT_BASE="develop"                  # base de branches novas; sem origin/develop usa a branch padrão do remoto
SYNC_STRATEGY="merge"                   # 'feat sync': merge | rebase
OPEN_CMD="zed -n"                       # como abrir a feature (janela nova)
# ENV_DIR="$HOME/.local/share/feat/lexxy/env"   # templates de .env por repo (fora do git!)
